<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
  <title id="title">날짜 변경 프리즘 스티커</title>
  <desc id="desc">희망 날짜를 적을 수 있는 정사면체 홀로그램 스티커</desc>
  <defs>
    <linearGradient id="left" x1="80" y1="70" x2="310" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaffff"/><stop offset=".35" stop-color="#71efff"/><stop offset=".7" stop-color="#9b8eff"/><stop offset="1" stop-color="#ff99d8"/>
    </linearGradient>
    <linearGradient id="right" x1="300" y1="60" x2="535" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".3" stop-color="#ff9fdb"/><stop offset=".6" stop-color="#fff176"/><stop offset="1" stop-color="#71f1c4"/>
    </linearGradient>
    <linearGradient id="base" x1="95" y1="485" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8aa4ff"/><stop offset=".38" stop-color="#ff8ed0"/><stop offset=".7" stop-color="#fff384"/><stop offset="1" stop-color="#75efcf"/>
    </linearGradient>
    <linearGradient id="memo" x1="100" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ff6ff"/><stop offset=".32" stop-color="#c09cff"/><stop offset=".58" stop-color="#ff9fd8"/><stop offset=".8" stop-color="#fff183"/><stop offset="1" stop-color="#79ecc9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="18" result="offset"/>
      <feFlood flood-color="#44326c" flood-opacity=".3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="foil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".016 .1" numOctaves="2" seed="20" result="n"/>
      <feColorMatrix in="n" values="1 0 0 0 .3 0 1 0 0 .3 0 0 1 0 .3 0 0 0 .18 0" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="screen"/>
    </filter>
    <path id="outline" d="M300 41 548 487 482 487 482 594 118 594 118 487 52 487Z"/>
  </defs>
  <g filter="url(#shadow)">
    <use href="#outline" fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
    <path d="M300 41 52 487 300 344Z" fill="url(#left)" stroke="#111" stroke-width="8" stroke-linejoin="round" filter="url(#foil)"/>
    <path d="M300 41 548 487 300 344Z" fill="url(#right)" stroke="#111" stroke-width="8" stroke-linejoin="round" filter="url(#foil)"/>
    <path d="M52 487 300 344 548 487Z" fill="url(#base)" stroke="#111" stroke-width="8" stroke-linejoin="round" filter="url(#foil)"/>
    <path d="M118 487h364v107H118Z" fill="#fff" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
    <path d="M118 487h364v19H118Z" fill="url(#memo)"/>
  </g>
  <path d="M300 41v303M52 487l248-143 248 143" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5"/>
  <g transform="translate(255 105)">
    <rect x="0" y="10" width="90" height="76" rx="11" fill="#111"/>
    <rect x="9" y="29" width="72" height="47" rx="4" fill="#fff"/>
    <path d="M22 0v22M68 0v22" stroke="#111" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 44h12M45 44h12M67 44h6M22 61h12M45 61h12M67 61h6" stroke="#111" stroke-width="6"/>
  </g>
  <text x="300" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" letter-spacing="7">SCHEDULE</text>
  <rect x="138" y="251" width="324" height="99" rx="14" fill="#111"/>
  <text x="300" y="319" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="58" font-weight="900" fill="#fff" letter-spacing="-3">날짜 변경</text>
  <text x="300" y="559" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" font-weight="800" fill="#111">희망 날짜</text>
  <path d="M340 558h98" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <g fill="#111">
    <path d="m99 377 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
    <path d="m490 316 4 10 11 4-11 4-4 11-4-11-11-4 11-4Z"/>
  </g>
</svg>
