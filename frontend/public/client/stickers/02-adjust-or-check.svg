<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">조정 또는 확인 필요 프리즘 스티커</title>
  <desc id="desc">원형 홀로그램 조정 및 확인 스티커</desc>
  <defs>
    <linearGradient id="holo" x1="80" y1="70" x2="525" y2="535" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".13" stop-color="#88efff"/>
      <stop offset=".27" stop-color="#b497ff"/>
      <stop offset=".42" stop-color="#ff9bd8"/>
      <stop offset=".57" stop-color="#ffef74"/>
      <stop offset=".71" stop-color="#68f1bf"/>
      <stop offset=".86" stop-color="#799cff"/>
      <stop offset="1" stop-color="#f9d9ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="offset"/>
      <feFlood flood-color="#3f3a65" flood-opacity=".28" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="foil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".014 .09" numOctaves="2" seed="12" result="n"/>
      <feColorMatrix in="n" values="1 0 0 0 .3 0 1 0 0 .3 0 0 1 0 .3 0 0 0 .2 0" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="screen"/>
    </filter>
    <path id="topArc" d="M112 300a188 188 0 0 1 376 0"/>
    <path id="bottomArc" d="M488 300a188 188 0 0 1-376 0"/>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="300" cy="300" r="247" fill="#fff" stroke="#fff" stroke-width="30"/>
    <circle cx="300" cy="300" r="247" fill="url(#holo)" stroke="#111" stroke-width="8" filter="url(#foil)"/>
    <circle cx="300" cy="300" r="218" fill="none" stroke="#111" stroke-width="3"/>
    <circle cx="300" cy="300" r="198" fill="url(#shine)"/>
  </g>
  <text font-family="Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="7">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CHECK / ADJUST</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PRISM REVIEW</textPath>
  </text>
  <g fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 243c25-56 77-92 139-92 39 0 75 14 102 38"/>
    <path d="m392 153 31 39-48 13"/>
    <path d="M424 357c-24 57-78 94-140 94-39 0-74-14-102-38"/>
    <path d="m207 449-31-39 48-13"/>
  </g>
  <path d="M300 172 402 350 198 350Z" fill="#fff" fill-opacity=".28" stroke="#111" stroke-opacity=".18" stroke-width="3"/>
  <path d="M300 172v178M198 350l102-61 102 61" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="4"/>
  <rect x="142" y="231" width="316" height="137" rx="68" fill="#111"/>
  <text x="300" y="288" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" font-weight="900" fill="#fff" letter-spacing="-2">조정 또는</text>
  <text x="300" y="340" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="48" font-weight="900" fill="#fff" letter-spacing="-2">확인 필요</text>
  <g fill="#111">
    <path d="m103 176 5 12 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
    <path d="m492 405 5 12 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
  </g>
</svg>
