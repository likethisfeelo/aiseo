<title>AISEO 라이브러리 — 성공사례·SEO전략 모음 | AISEO.TIPS</title>

<style>
  :root{
    --accent:#C4A8F5;
    --accent-light:rgba(196,168,245,0.14);
    --accent-mid:#9BB8F8;
    --accent-dark:#8B6FD4;
    --accent-deep:#6B4FB8;
    --ink:#0A0614;
    --ink-soft:#6B7280;
    --ink-muted:#9CA3AF;
    --bg:#FFFFFF;
    --bg-soft:#F9FAFB;
    --bg-dark:#0A0614;
    --bg-dark2:#0F0A1F;
    --line:#E5E7EB;
    --line-soft:#F3F4F6;
    --radius:16px;
    --radius-lg:28px;
    --maxw:1180px;
    --display:'Plus Jakarta Sans', sans-serif;
    --body:'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .display{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body);font-weight:700;font-size:15px;padding:14px 24px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:transform .15s ease, background .2s, box-shadow .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn-dark{background:var(--accent-dark);color:#fff}
  .btn-dark:hover{background:var(--accent-deep);box-shadow:0 12px 28px -10px rgba(139,111,212,.6)}
  .btn-accent{background:var(--accent);color:var(--ink)}
  .btn-accent:hover{box-shadow:0 12px 28px -10px rgba(196,168,245,.7)}
  .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.16)}

  /* ============ HERO ============ */
  .hero{position:relative;min-height:760px;height:100vh;max-height:1000px;overflow:hidden;background:#0A0614}
  .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
  .hero-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(10,6,20,.55) 0%, rgba(10,6,20,.35) 38%, rgba(10,6,20,.65) 100%)}

  .nav{position:absolute;top:18px;right:0;left:0;z-index:31;display:flex;justify-content:flex-end;align-items:center;gap:28px;padding:0 32px}
  .nav .method{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;backdrop-filter:blur(8px)}
  .nav .method .glyph{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-mid));display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink);font-weight:800}
  .nav a.link{font-size:15px;font-weight:500;color:rgba(255,255,255,.9);transition:opacity .2s;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .nav a.link:hover{opacity:.6}
  .ext-icon{display:inline-block;margin-left:4px;font-size:.85em;opacity:.7;transform:translateY(-1px);font-weight:400}
  a:hover .ext-icon{opacity:1}
  .nav .waitlist{background:var(--accent);color:var(--ink);padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;transition:padding-right .2s}
  .nav .waitlist:hover{padding-right:28px}
  .nav-user-icon{display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;
    color:rgba(255,255,255,.88);
    transition:background .15s,color .15s,opacity .15s}
  .nav-user-icon:hover{background:rgba(255,255,255,.15);color:#fff}

  /* centered hero content */
  .hero-content{position:relative;z-index:20;text-align:center;max-width:820px;margin:0 auto;
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 24px 0}
  .hero-eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .hero h1{font-family:var(--display);font-size:clamp(44px,6.4vw,80px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.55)}
  .hero h1 .accent{color:var(--accent)}
  .hero .lede{font-size:clamp(16px,1.5vw,19px);color:rgba(255,255,255,.88);max-width:34ch;margin:22px auto 0;font-weight:500;line-height:1.7;text-shadow:0 2px 16px rgba(0,0,0,.55)}
  .hero-cta{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
  .hero-diag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px 34px;font-size:16px;box-shadow:0 8px 30px -10px rgba(0,0,0,.5)}
  .hero-diag:hover{background:rgba(255,255,255,.24)}

  /* trusted */
  .trusted{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:20}
  .trusted .t-label{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.72);text-shadow:0 2px 12px rgba(0,0,0,.5)}

  /* ============ DOWNSTREAM SECTIONS ============ */
  section{padding:64px 0}
  .sec-head{max-width:680px;margin-bottom:54px}
  .sec-tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:16px}
  .sec-head h2{font-family:var(--display);font-size:clamp(30px,4.4vw,50px);font-weight:700;letter-spacing:-.02em;line-height:1.12;margin-bottom:18px}
  .sec-head p{font-size:17px;color:var(--ink-soft);max-width:48ch;line-height:1.7}

  /* ===== OPERATING MODEL ===== */
  .opmodel{position:relative;background:var(--bg-soft);overflow:hidden;padding:0}
  .opmodel .inner{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:72px 32px 80px}
  .op-grid{display:grid;grid-template-columns:.82fr 1.18fr;column-gap:64px;
    grid-template-areas:"title explore" "title pills" "detail illo" "arrows illo"}
  .op-title{grid-area:title;font-family:var(--display);font-weight:700;font-size:clamp(38px,4.8vw,56px);line-height:1.04;letter-spacing:-.02em;color:var(--ink);margin:0}
  .op-explore{grid-area:explore;font-family:var(--display);font-size:17px;font-weight:600;color:var(--accent-dark);margin-bottom:16px;letter-spacing:.01em}
  .op-pills{grid-area:pills;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
  .op-pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);color:var(--ink);font-family:var(--body);font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  .op-pill:hover{border-color:var(--accent)}
  .op-pill.active{background:var(--accent-light);border-color:rgba(196,168,245,.5)}
  .op-pill i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-dark);flex-shrink:0;transition:background .2s}
  .op-pill.active i{background:var(--accent-dark)}
  .op-detail{grid-area:detail;margin-top:60px;max-width:360px}
  .op-num{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:24px}
  .op-num b{font-weight:800;background:var(--accent-light);color:var(--accent-deep);padding:3px 8px;border-radius:6px}
  .op-step-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;margin-bottom:16px;color:var(--ink)}
  .op-step-desc{font-size:15.5px;line-height:1.7;color:var(--ink-soft)}
  .op-arrows{grid-area:arrows;display:flex;gap:14px;margin-top:32px}
  .op-arrow{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);background:#fff;color:var(--accent-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;transition:background .2s,opacity .2s,transform .15s}
  .op-arrow:hover:not(:disabled){transform:translateY(-1px)}
  .op-arrow.filled{background:var(--accent);border-color:var(--accent)}
  .op-arrow:disabled{opacity:.4;cursor:default}
  .op-illo{grid-area:illo;position:relative;align-self:start}
  .op-illo .glow{position:absolute;left:8%;bottom:6%;width:62%;height:55%;background:radial-gradient(circle,rgba(196,168,245,.4),transparent 65%);z-index:0;filter:blur(10px)}
  .op-illo svg{position:relative;z-index:1;width:100%;height:auto;display:block;transition:opacity .35s ease}
  .op-illo img{position:relative;z-index:1;width:100%;height:auto;display:block;transition:opacity .35s ease}
  @media(max-width:900px){
    .opmodel .inner{padding:52px 22px 60px}
    .op-grid{grid-template-columns:1fr;grid-template-areas:"title" "explore" "pills" "illo" "detail" "arrows"}
    .op-title{margin-bottom:28px;font-size:clamp(34px,10vw,48px)}
    .op-pills{margin-bottom:26px}
    .op-detail{margin-top:30px;max-width:none}
    .op-arrows{margin-top:24px}
  }

  /* ===== HOW WE GET IT DONE (question bank) ===== */
  .howto{background:var(--bg-soft);position:relative;overflow:hidden;padding:106px 0 72px}
  .howto .head{position:relative;z-index:1;text-align:center;max-width:780px;margin:0 auto 52px;padding:0 24px}
  .howto .head h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.6vw,52px);letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
  .howto .head p{margin-top:14px;font-size:16px;color:var(--ink-soft);font-weight:500}
  .howto-card{position:relative;z-index:1;max-width:1240px;margin:0 auto;background:#fff;border-radius:28px;display:grid;grid-template-columns:312px 1fr;overflow:hidden;box-shadow:0 40px 90px -55px rgba(10,6,20,.4);border:1px solid var(--line)}
  .qbank{background:var(--ink);color:#fff;padding:26px 18px 44px}
  .qbank-title{font-family:var(--display);font-size:18px;font-weight:700;margin:6px 8px 18px;color:var(--accent)}
  .qbank-title u{text-decoration-thickness:2px;text-underline-offset:5px}
  .qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:12px;cursor:pointer;color:#e9e9e9;font-size:13.5px;font-weight:600;line-height:1.35;transition:background .2s,color .2s}
  .qrow:hover{background:#1d1733}
  .qrow.active{background:#fff;color:var(--ink)}
  .qrow .radio{width:18px;height:18px;border-radius:50%;border:2px solid #5b5470;flex-shrink:0;position:relative;transition:border-color .2s}
  .qrow.active .radio{border-color:var(--accent-dark)}
  .qrow.active .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent-dark)}
  .qmain{position:relative;padding:46px 38px 38px;display:grid;grid-template-columns:.92fr 1.08fr;gap:30px;align-items:stretch}
  .qside{align-self:center}
  .q-title{font-family:var(--display);font-weight:700;font-size:clamp(24px,2.6vw,31px);line-height:1.16;letter-spacing:-.01em;color:var(--ink)}
  .q-chip{display:inline-block;margin-top:22px;background:var(--accent-light);color:var(--accent-deep);font-weight:700;font-size:13px;padding:7px 15px;border-radius:999px}
  .walk{position:relative;display:flex;flex-direction:column}
  .nodes{display:inline-flex;justify-content:flex-start;align-items:center;gap:16px;min-height:34px;margin-bottom:22px;position:relative}
  .nodes::before{content:"";position:absolute;top:50%;left:15px;right:15px;height:1.5px;background:var(--line)}
  .node-t{width:30px;height:30px;border-radius:9px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .12s}
  .node-t:hover{border-color:var(--accent)}
  .node-t:active{transform:scale(.92)}
  .node-t:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px}
  .node-t.on{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 4px rgba(196,168,245,.18)}
  .node-t svg{width:15px;height:15px;stroke:#c4c4c4;fill:none;stroke-width:2.2}
  .node-t.on svg{stroke:var(--accent-dark)}
  .vcard{background:var(--bg-soft);border-radius:22px;padding:16px 16px 20px}
  .stage{background:#fff;border:2px solid var(--line);border-radius:16px;min-height:236px;display:flex;align-items:center;justify-content:center;padding:14px;transition:opacity .3s ease}
  .stage svg{max-width:100%;max-height:230px;height:auto}
  .stage img{max-width:100%;max-height:230px;width:auto;height:auto;display:block;border-radius:10px}
  .vcounter{margin:14px 4px 0;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
  .vcap{margin:6px 4px 0;font-size:14.5px;color:var(--ink-soft);line-height:1.6;min-height:calc(1.6em * 4)}
  .arrows{display:flex;justify-content:flex-end;margin-top:18px}
  .warrow{width:42px;height:34px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .2s,opacity .2s}
  .warrow:hover:not(:disabled){background:var(--bg-soft)}
  .warrow:first-child{border-radius:999px 0 0 999px;border-right:none}
  .warrow:last-child{border-radius:0 999px 999px 0}
  .warrow:disabled{opacity:.32;cursor:default}
  @media(max-width:900px){
    .howto{padding:64px 0 80px}
    .howto-card{grid-template-columns:1fr;border-radius:22px}
    .qmain{grid-template-columns:1fr;padding:30px 22px 30px;gap:24px}
    .qside{align-self:start}
    .nodes::before{left:15px;right:15px}
  }

  /* ===== CTA BAND ===== */
  .cta-band{text-align:center;padding:120px 0;background:var(--bg)}
  .cta-band h2{font-family:var(--display);font-weight:700;font-size:clamp(36px,5.6vw,64px);letter-spacing:-.02em;line-height:1.1;max-width:18ch;margin:0 auto 22px}
  .cta-band h2 em{font-style:normal;color:var(--accent-dark)}
  .cta-band p{font-size:18px;color:var(--ink-soft);max-width:48ch;margin:0 auto 34px;line-height:1.7}

  /* ===== LIBRARY ===== */
  .library{background:#150F28;position:relative;overflow:hidden;padding:90px 0 96px}
  .library .head{text-align:center;max-width:860px;margin:0 auto 40px;padding:0 24px}
  .library .head h2{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.2vw,56px);letter-spacing:-.02em;line-height:1.08;color:#fff}
  .library .head p{margin-top:14px;font-size:16px;color:rgba(255,255,255,.65);font-weight:500}
  .lib-bar{max-width:1200px;margin:0 auto 22px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .lib-tabs{display:flex;gap:10px}
  .lib-tabs button{font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);padding:9px 18px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
  .lib-tabs button:hover{transform:translateY(-1px)}
  .lib-tabs button.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .lib-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;min-width:250px}
  .lib-search input{border:none;outline:none;background:none;font-family:var(--body);font-size:14px;flex:1;color:#fff}
  .lib-search input::placeholder{color:rgba(255,255,255,.5)}
  .lib-search svg{width:16px;height:16px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;flex-shrink:0}
  .shelf-wrap{max-width:1200px;margin:0 auto;padding:0 28px;position:relative}
  .shelf{--spine-w:64px;--cover-w:342px;--book-h:480px;--book-gap:30px;
    background:#0A0614;border-radius:30px;padding:34px calc(var(--cover-w) + 48px) 34px 34px;
    display:flex;gap:var(--book-gap);align-items:center;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;min-height:560px;perspective:1600px;perspective-origin:center center;scroll-behavior:smooth}
  .shelf::-webkit-scrollbar{display:none}
  .book{flex:0 0 var(--spine-w);width:var(--spine-w);height:var(--book-h);position:relative;cursor:pointer;align-self:center;transform-style:preserve-3d;isolation:isolate;
    transition:flex-basis .62s cubic-bezier(.22,.8,.25,1),transform .58s cubic-bezier(.22,.8,.25,1),filter .25s ease}
  .book.open{flex-basis:var(--cover-w);transform:translateY(-8px) scale(1.012);z-index:20;cursor:default}
  .book.flipping{z-index:24}
  .book.hidden{display:none}
  .book .spine{position:absolute;left:0;top:0;width:var(--spine-w);height:100%;display:flex;align-items:center;justify-content:center;border-radius:7px 7px 5px 5px;
    box-shadow:inset -8px 0 12px -8px rgba(0,0,0,.5),inset 7px 0 10px -8px rgba(255,255,255,.25),0 12px 22px -18px rgba(0,0,0,.8);
    transform-origin:left center;transform:rotateY(0deg) translateZ(2px);backface-visibility:hidden;
    transition:transform .72s cubic-bezier(.25,.8,.25,1),opacity .4s cubic-bezier(.4,0,.7,.2) .08s,filter .22s ease,box-shadow .35s ease}
  .book.open .spine{transform:rotateY(108deg) translateZ(2px);opacity:0}
  .book:not(.open):hover .spine{filter:brightness(1.12)}
  .book .stitle{writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--body);font-weight:700;font-size:13px;color:#fff;white-space:nowrap;max-height:380px;overflow:hidden;text-overflow:ellipsis}
  .book .sbadge{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
  .book .sbadge .glyph{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:11px;color:var(--accent-dark)}
  .book .sbadge .lab{font-size:5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.02em;line-height:1}
  .book .feature{position:absolute;left:0;top:-10px;width:var(--cover-w);height:calc(var(--book-h) + 20px);background:#fff;border-radius:16px;padding:31px 30px 0;display:flex;flex-direction:column;
    transform-origin:left center;transform:rotateY(-76deg) translateX(10px) translateZ(1px) scale(.975);backface-visibility:hidden;pointer-events:none;opacity:0;
    box-shadow:0 18px 45px rgba(0,0,0,0),0 50px 90px rgba(0,0,0,0);
    transition:transform .72s cubic-bezier(.25,.8,.25,1) .1s,opacity .3s ease .18s,box-shadow .52s ease .14s}
  /* will-change only while interacting (perf: avoid always-on GPU layers) */
  .book:hover, .book.open, .book.flipping,
  .book:hover .spine, .book.open .spine, .book.flipping .spine,
  .book:hover .feature, .book.open .feature, .book.flipping .feature{will-change:transform,opacity}
  .book.open .feature{transform:rotateY(0deg) translateX(0) translateZ(1px) scale(1);pointer-events:auto;opacity:1;box-shadow:0 18px 45px rgba(0,0,0,.3),0 52px 90px -28px rgba(0,0,0,.6)}

  .feature .fmeta{margin-top:16px;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .feature .fdesc{margin-top:12px;font-size:13px;line-height:1.6;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

     항목 클릭 시 /library/{cover}/{post}/ 로 navigation. */
  .feature .chap-head{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-muted);border-top:1px solid var(--line-soft);padding-top:14px}
  .feature .chap-list{margin-top:8px;max-height:200px;overflow-y:auto;padding-right:6px}

  /* skeleton placeholder while API loads */
  .book.skel .spine{background:linear-gradient(135deg,#E5E0F2,#D4CBE8) !important;animation:skelpulse 1.4s ease-in-out infinite}
  @keyframes skelpulse{0%,100%{opacity:.6}50%{opacity:1}}
  .lib-error{padding:40px 24px;text-align:center;color:var(--ink-soft)}
  .lib-error button{margin-top:14px;background:var(--accent-dark);color:#fff;border:none;padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
  .shelf-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:0 8px 18px -6px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;z-index:30;color:var(--ink);transition:transform .15s,opacity .2s}

/* ===== v10 Orb palette update: Ivory / Lavender / Thistle / Sky / Periwinkle ===== */
/* ============================================================
   ORBIT TILES — SINGLE AUTHORITATIVE BLOCK (consolidated)
   Per-STAGE color: SEO(stage1)=kept, AEO(stage2)/GEO(stage3)=new palettes.
   Per-tile subtle variation via --tile (1..3) within each stage.
   This block is the single source of truth; earlier .cl-pal/.cl-layer
   background rules are intentionally neutralized above.
   ============================================================ */
.cl-pal{
  border:none !important;
  box-shadow:none !important;
  background:transparent !important;
  overflow:visible !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
.cl-pal::before{display:none !important}
.cl-pal::after{display:none !important}

/* base layer shell */
.cl-pal .cl-layer{
  background:transparent;            /* default; each stage sets its own below */
  border-radius:50%;
}
/* glassy top highlight on every layer */
.cl-pal .cl-layer::before{display:none !important}
.cl-pal .cl-layer svg,
.cl-pal img{
  color:#fff; fill:#fff;
  filter:drop-shadow(0 1px 3px rgba(38,18,82,.26));

/* ---- STAGE 1 · SEO — KEPT (current periwinkle / sky / thistle mix) ---- */

  background:transparent;
}

<script>
/* ============================================================
   AI SEO LIBRARY catalogue — covers (책장의 책) 를 API 에서
   동적 로드. 책 하나 = 표지(Cover) 한 권. 펼치면 그 책의 챕터
   목록(글목록) 노출, 챕터 클릭 시 /library/{cover}/{post}/ 리더로.

   "북 > 글목록 > 글" 흐름의 카탈로그 진입점.
   ============================================================ */
(function(){
  var CFG = window.AISEO_READER_CONFIG || {};
  var API_BASE = (CFG.apiBase || 'https://api.aiseo.tips').replace(/\/+$/, '');

  // 책등 색상 팔레트 (DB 에 색 정보 없으므로 sortOrder 기준 cycling).
  var SPINE_COLORS = ['#7a6fa8','#6f7aa8','#8b6fd4','#7d72a8','#8478ac','#6f8aa8','#9779b8'];

  var shelf = document.getElementById('shelf');
  var libSearch = document.getElementById('libSearch');
  var libTabs = document.getElementById('libTabs');

  // ── State ────────────────────────────────────────────────────
  // covers: [{slug,title,description,tag,sortOrder,chapters:[{slug,title,readMinutes}],_chaptersLoaded}]
  var STATE = {
    covers: [],
    filterTag: 'all',  // 'all' | tag value (예: 'Case Studies', 'Playbooks')
    query: '',
    openIdx: 0,
  };
  var bookEls = [];
  var emptyMsg = null;
  var centerTimer = null;

  // ── DOM helpers ──────────────────────────────────────────────
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Skeleton (로딩 중 책장 placeholder) ──────────────────────
  function renderSkeleton(){
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<div class="book skel" aria-hidden="true">'
        + '<div class="spine"><span class="stitle">&nbsp;</span></div>'
        + '</div>';
    }
    shelf.innerHTML = html;
  }

  // ── Error fallback ───────────────────────────────────────────
  function renderError(msg){
    shelf.innerHTML = '<div class="lib-error">'
      + '<p>' + escapeHtml(msg || '콘텐츠를 불러올 수 없습니다.') + '</p>'
      + '<button id="lib-retry">다시 시도</button>'
      + '</div>';
    var btn = document.getElementById('lib-retry');
    if (btn) btn.addEventListener('click', boot);
  }

  // ── Render covers (books) ────────────────────────────────────
  function renderShelf(){
    if (!STATE.covers.length) {
      shelf.innerHTML = '<div class="lib-error"><p>아직 발행된 표지가 없습니다.<br>관리자가 곧 콘텐츠를 채울 예정입니다.</p></div>';
      return;
    }
    shelf.innerHTML = STATE.covers.map(function(c, i){
      var color = SPINE_COLORS[i % SPINE_COLORS.length];
      return '<div class="book" data-i="' + i + '" tabindex="0" role="button" aria-label="' + escapeHtml(c.title) + ' 펼치기">'
        +   '<div class="spine" style="background:' + color + '">'
        +     '<span class="stitle">' + escapeHtml(c.title) + '</span>'
        +     '<span class="sbadge"><span class="glyph">A</span><span class="lab">AISEO</span></span>'
        +   '</div>'
        +   '<div class="feature" data-cover="' + escapeHtml(c.slug) + '">'
        +     '<h3>' + escapeHtml(c.title) + '</h3>'
        +     '<div class="fmeta">' + escapeHtml(c.tag || 'AI SEO LIBRARY') + '</div>'
        +     (c.description ? '<div class="fdesc">' + escapeHtml(c.description) + '</div>' : '')
        +     '<div class="chap-head">글목록</div>'
        +     '<div class="chap-list" data-list-for="' + escapeHtml(c.slug) + '">'
        +       '<div class="cempty">불러오는 중…</div>'
        +     '</div>'
        +   '</div>'
        + '</div>';
    }).join('');

    bookEls = Array.prototype.slice.call(shelf.querySelectorAll('.book'));
    bookEls.forEach(function(el, i){
      var openBook = function(){
        if (i !== STATE.openIdx) {
          STATE.openIdx = i;
          update(true);
        }
        // 챕터 목록은 책이 열린 후 lazy fetch (이미 로드된 표지는 skip).
        ensureChaptersLoaded(STATE.covers[i]);
      };
      el.addEventListener('click', openBook);
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
      });
    });
  }

  // ── Chapter list inside a feature panel ──────────────────────
  function renderChaptersFor(cover){
    var listEl = shelf.querySelector('[data-list-for="' + cssEscape(cover.slug) + '"]');
    if (!listEl) return;
    var chapters = cover.chapters || [];
    var visible = chapters.filter(function(ch){
      if (!STATE.query) return true;
      return (ch.title || '').toLowerCase().indexOf(STATE.query.toLowerCase()) !== -1;
    });
    if (!visible.length) {
      listEl.innerHTML = '<div class="cempty">'
        + (chapters.length ? '검색어와 일치하는 글이 없습니다.' : '이 표지에는 아직 글이 없습니다.')
        + '</div>';
      return;
    }
    listEl.innerHTML = visible.map(function(ch, i){
      var href = '/library/' + encodeURIComponent(cover.slug) + '/' + encodeURIComponent(ch.slug) + '/';
      var meta = ch.readMinutes ? (' · ' + ch.readMinutes + '분') : '';
      return '<a href="' + href + '" aria-label="' + escapeHtml(ch.title) + ' 읽기">'
        +   '<span class="cidx">' + String(i + 1).padStart(2, '0') + '</span>'
        +   '<span>' + escapeHtml(ch.title || ch.slug) + '<span style="color:var(--ink-muted);font-weight:500">' + escapeHtml(meta) + '</span></span>'
        + '</a>';
    }).join('');
  }

  // CSS.escape polyfill — 한국어 slug 가 들어와도 안전하지만 표지 slug 는
  // 영문이라 사실상 안 쓰임. 그래도 attribute selector 안전을 위해 적용.
  function cssEscape(s){
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, function(c){ return '\\' + c; });
  }

  // ── Lazy chapter fetch ───────────────────────────────────────
  function ensureChaptersLoaded(cover){
    if (!cover || cover._chaptersLoaded || cover._chaptersLoading) return;
    cover._chaptersLoading = true;
    fetch(API_BASE + '/library/covers/' + encodeURIComponent(cover.slug))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.success) {
          cover.chapters = (j.data && j.data.chapters) || [];
          cover._chaptersLoaded = true;
        } else {
          cover.chapters = [];
          cover._chaptersLoaded = true;
        }
      })
      .catch(function(){
        cover.chapters = [];
        cover._chaptersLoaded = true;
      })
      .then(function(){
        cover._chaptersLoading = false;
        renderChaptersFor(cover);
      });
  }

  // ── Filter / visibility ──────────────────────────────────────
  function isVisible(cover){
    if (STATE.filterTag !== 'all') {
      // tag 정확 매칭 (대소문자 무시).
      var t = (cover.tag || '').toLowerCase();
      if (t.indexOf(STATE.filterTag.toLowerCase()) === -1) return false;
    }
    if (!STATE.query) return true;
    // 검색은 cover title + chapter titles 양쪽 매칭.
    var q = STATE.query.toLowerCase();
    if ((cover.title || '').toLowerCase().indexOf(q) !== -1) return true;
    if (Array.isArray(cover.chapters)) {
      for (var i = 0; i < cover.chapters.length; i++) {
        if ((cover.chapters[i].title || '').toLowerCase().indexOf(q) !== -1) return true;
      }
    }
    return false;
  }
  function visIdxs(){
    var arr = [];
    for (var i = 0; i < STATE.covers.length; i++) if (isVisible(STATE.covers[i])) arr.push(i);
    return arr;
  }

  function getCoverWidth(){
    var v = getComputedStyle(shelf).getPropertyValue('--cover-w').trim();
    return parseFloat(v) || 342;
  }
  function centerOpen(smooth){
    var o = bookEls[STATE.openIdx];
    if (!o || o.classList.contains('hidden')) return;
    var coverW = Math.max(getCoverWidth(), o.offsetWidth);
    var target = o.offsetLeft - (shelf.clientWidth - coverW) / 2;
    var max = shelf.scrollWidth - shelf.clientWidth;
    shelf.scrollTo({ left: Math.max(0, Math.min(max, target)), behavior: smooth ? 'smooth' : 'auto' });
  }
  function update(smooth){
    if (emptyMsg) { emptyMsg.remove(); emptyMsg = null; }
    if (centerTimer) clearTimeout(centerTimer);
    if (smooth) {
      shelf.classList.add('library-switching');
      setTimeout(function(){ shelf.classList.remove('library-switching'); }, 820);
    }
    var previous = shelf.querySelector('.book.open');
    if (previous) {
      previous.classList.add('flipping');
      setTimeout(function(){ previous.classList.remove('flipping'); }, 820);
    }
    bookEls.forEach(function(el, i){
      var visible = isVisible(STATE.covers[i]);
      el.classList.toggle('hidden', !visible);
      el.setAttribute('aria-hidden', String(!visible));
    });
    var vis = visIdxs();
    if (!vis.length) {
      emptyMsg = document.createElement('div');
      emptyMsg.style.cssText = 'color:#9a9a9e;margin:auto;font-size:14px';
      emptyMsg.textContent = '검색 결과가 없습니다';
      shelf.appendChild(emptyMsg);
      return;
    }
    if (vis.indexOf(STATE.openIdx) === -1) STATE.openIdx = vis[0];
    bookEls.forEach(function(el, i){
      var isOpen = i === STATE.openIdx;
      el.classList.toggle('open', isOpen);
      el.setAttribute('aria-expanded', String(isOpen));
    });
    if (smooth) centerTimer = setTimeout(function(){ centerOpen(true); }, 360);
    else centerOpen(false);

    // 열린 책의 챕터 목록은 검색 필터 변경 시 다시 그려야 함.
    var openCover = STATE.covers[STATE.openIdx];
    if (openCover && openCover._chaptersLoaded) renderChaptersFor(openCover);
    if (openCover) ensureChaptersLoaded(openCover);
  }

  // ── Category tab buttons ─────────────────────────────────────
  // 시드 데이터의 tag: 'Case Studies' (case-studies), 'Playbooks' (playbooks).
  // 기존 탭 (전체/성공사례/SEO전략) 의 data-c 값 'case'/'play' 를 tag 매칭용으로 매핑.
  var TAB_TAG_MAP = { 'all': 'all', 'case': 'case studies', 'play': 'playbooks' };
  function setupTabs(){
    if (!libTabs) return;
    var tabBtns = libTabs.querySelectorAll('button');
    tabBtns.forEach(function(b){
      b.addEventListener('click', function(){
        tabBtns.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        STATE.filterTag = TAB_TAG_MAP[b.dataset.c] || 'all';
        update(true);
      });
    });
  }

  // ── Search input ─────────────────────────────────────────────
  function setupSearch(){
    if (!libSearch) return;
    libSearch.addEventListener('input', function(e){
      STATE.query = e.target.value;
      update(true);
    });
  }

  // ── Prev / Next arrows ───────────────────────────────────────
  function setupArrows(){
    var prev = document.getElementById('libPrev');
    var next = document.getElementById('libNext');
    if (prev) prev.addEventListener('click', function(){
      var v = visIdxs(), p = v.indexOf(STATE.openIdx);
      if (p > 0) { STATE.openIdx = v[p - 1]; update(true); ensureChaptersLoaded(STATE.covers[STATE.openIdx]); }
    });
    if (next) next.addEventListener('click', function(){
      var v = visIdxs(), p = v.indexOf(STATE.openIdx);
      if (p < v.length - 1) { STATE.openIdx = v[p + 1]; update(true); ensureChaptersLoaded(STATE.covers[STATE.openIdx]); }
    });
  }

  // ── Boot ─────────────────────────────────────────────────────
  function boot(){
    renderSkeleton();
    fetch(API_BASE + '/library/covers')
      .then(function(r){
        return r.json().then(function(j){ return { ok: r.ok, j: j }; });
      })
      .then(function(res){
        if (!res.ok || !res.j || !res.j.success) {
          throw new Error((res.j && res.j.error) || ('API error ' + (res.ok ? 'unknown' : 'http')));
        }
        var covers = (res.j.data && res.j.data.covers) || [];
        // sortOrder 오름차순 (API 가 이미 정렬해서 보내지만 한 번 더 안전하게).
        covers.sort(function(a, b){ return (a.sortOrder || 9999) - (b.sortOrder || 9999); });
        STATE.covers = covers;
        STATE.openIdx = 0;
        renderShelf();
        update(false);
        // 첫 번째 책의 챕터를 미리 받아두면 사용자가 펼치자마자 보임.
        if (STATE.covers[0]) ensureChaptersLoaded(STATE.covers[0]);
      })
      .catch(function(err){
        console.error('library catalogue fetch failed', err);
        renderError(err.message || '콘텐츠를 불러올 수 없습니다.');
      });
  }

  setupTabs();
  setupSearch();
  setupArrows();
  boot();
  window.addEventListener('resize', function(){ centerOpen(false); });

  /* Floating nav docking — reader 와 같은 패턴.
     .lib-bar (탭 + 검색) 바닥 통과 시 docked. 본문(책장) 인터랙션 영역에
     진입할 때 메뉴가 위로 붙음. 콘텐츠 높이에 자동 적응. */
  (function setupDockingNav(){
    var navEl = document.querySelector('.lib-page .nav');
    if (!navEl) return;
    var FALLBACK = 400;
    var threshold = FALLBACK;
    var anchorEl = null;
    var refreshThreshold = function(){
      anchorEl = anchorEl || document.querySelector('.lib-page .lib-bar');
      if (anchorEl) {
        var rect = anchorEl.getBoundingClientRect();
        threshold = (window.scrollY || 0) + rect.bottom - 40;
      }
    };
    refreshThreshold();
    setTimeout(refreshThreshold, 300);
    var apply = function(){
      if (window.scrollY > threshold) navEl.classList.add('docked');
      else navEl.classList.remove('docked');
    };
    window.addEventListener('scroll', apply, { passive: true });
    window.addEventListener('resize', function(){
      anchorEl = null;
      refreshThreshold();
      apply();
    });
    apply();
  })();

  /* reveal animation 트리거 (aiseo-main 에선 IntersectionObserver 가 .reveal 을
     다른 곳에서 활성화하지만, 이 페이지엔 그게 없으니 즉시 visible 처리). */
  document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
})();
</script>

<!-- 사람 아이콘 로그인 상태 분기 (aiseo-main 과 동일) -->
<script>
(function(){
  var btn = document.getElementById('nav-user-btn');
  if (!btn) return;
  var token = localStorage.getItem('aiseo.idToken');
  if (!token) return;
  try {
    var parts = token.split('.');
    if (parts.length < 2) return;
    var b64 = parts[1].replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var payload = JSON.parse(decodeURIComponent(escape(atob(b64))));
    if (payload.exp && payload.exp * 1000 > Date.now()) {
      btn.setAttribute('href', '/account.html');
      btn.setAttribute('aria-label', '내 계정 (로그인됨)');
    }
  } catch(e) {}
})();
</script>
