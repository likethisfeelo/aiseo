      <path d="M0 244 C-74 244-124 188-124 122 V66 L-220 10 C-274-22-292-92-260-146 C-228-201-158-219-104-188 L-52-158"/>
      <path d="M-211 122 C-248 58-224-14-168-48 L-120-76 L-120-188 C-120-252-68-302-4-302 C60-302 112-252 112-188 V-128"/>
      <path d="M-211-122 C-174-186-100-204-44-170 L4-142 L100-198 C154-230 224-212 256-158 C288-104 270-34 216-2 L164 28"/>
