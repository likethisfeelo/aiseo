      <feColorMatrix in="n" values="1 0 0 0 .28 0 1 0 0 .28 0 0 1 0 .28 0 0 0 .2 0" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="screen"/>
    </filter>
