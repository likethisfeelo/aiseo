<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" role="img" aria-labelledby="title desc">
  <title id="title">협의 필요 프리즘 스티커</title>
  <desc id="desc">협의 필요 글자가 강조된 홀로그램 말풍선 별 스티커</desc>
  <defs>
    <linearGradient id="holo" x1="70" y1="45" x2="580" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".12" stop-color="#78efff"/>
      <stop offset=".27" stop-color="#aa91ff"/>
      <stop offset=".41" stop-color="#ff8ed2"/>
      <stop offset=".56" stop-color="#fff178"/>
      <stop offset=".72" stop-color="#62efbd"/>
