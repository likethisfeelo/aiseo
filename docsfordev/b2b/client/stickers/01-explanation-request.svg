<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">설명 요청 프리즘 스티커</title>
  <desc id="desc">큰 물음표가 있는 홀로그램 톱니형 스티커</desc>
  <defs>
    <linearGradient id="holo" x1="60" y1="60" x2="540" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".14" stop-color="#6ff5ff"/>
      <stop offset=".29" stop-color="#a99cff"/>
      <stop offset=".43" stop-color="#ff91d6"/>
      <stop offset=".58" stop-color="#fff38c"/>
      <stop offset=".72" stop-color="#79f2c8"/>
      <stop offset=".87" stop-color="#90b8ff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="offset"/>
      <feFlood flood-color="#4e3b72" flood-opacity=".28" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="foil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .11" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" values="1 0 0 0 .25 0 1 0 0 .25 0 0 1 0 .25 0 0 0 .22 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
    <path id="seal" d="M300 36 337 65 382 47 404 89 453 86 459 135 506 151 490 198 529 228 499 266 525 307 484 334 496 382 448 394 437 442 388 436 362 477 319 454 283 486 249 452 204 472 181 429 132 432 126 383 79 368 96 321 56 293 85 253 60 211 103 186 94 137 143 128 157 81 205 90 233 50 273 75Z"/>
  </defs>
  <g filter="url(#shadow)">
    <path d="M300 36 337 65 382 47 404 89 453 86 459 135 506 151 490 198 529 228 499 266 525 307 484 334 496 382 448 394 437 442 388 436 362 477 319 454 283 486 249 452 204 472 181 429 132 432 126 383 79 368 96 321 56 293 85 253 60 211 103 186 94 137 143 128 157 81 205 90 233 50 273 75Z" fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
    <path d="M300 36 337 65 382 47 404 89 453 86 459 135 506 151 490 198 529 228 499 266 525 307 484 334 496 382 448 394 437 442 388 436 362 477 319 454 283 486 249 452 204 472 181 429 132 432 126 383 79 368 96 321 56 293 85 253 60 211 103 186 94 137 143 128 157 81 205 90 233 50 273 75Z" fill="url(#holo)" stroke="#111" stroke-width="8" stroke-linejoin="round" filter="url(#foil)"/>
    <path d="M300 36 337 65 382 47 404 89 453 86 459 135 506 151 490 198 529 228 499 266 525 307 484 334 496 382 448 394 437 442 388 436 362 477 319 454 283 486 249 452 204 472 181 429 132 432 126 383 79 368 96 321 56 293 85 253 60 211 103 186 94 137 143 128 157 81 205 90 233 50 273 75Z" fill="url(#glow)"/>
    <path d="M300 70 476 372 124 372Z" fill="none" stroke="#111" stroke-opacity=".15" stroke-width="4"/>
    <path d="M300 70v302M124 372l176-105 176 105" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4"/>
  </g>
  <text x="300" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="8">QUESTION</text>
  <text x="300" y="352" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="238" font-weight="950">?</text>
  <rect x="163" y="393" width="274" height="83" rx="12" fill="#111"/>
  <text x="300" y="450" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="48" font-weight="900" fill="#fff" letter-spacing="-2">설명 요청</text>
  <g fill="#111">
    <path d="m112 238 7 15 16 2-12 11 3 16-14-8-15 8 3-16-12-11 17-2Z"/>
    <circle cx="461" cy="246" r="8"/>
    <path d="m469 111 4 10 11 4-11 4-4 11-4-11-11-4 11-4Z"/>
  </g>
</svg>
